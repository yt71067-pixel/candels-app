<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aore Candles Shop</title>
    <script src="https://telegram.org"></script>

    <style>
        body {
            font-family: sans-serif;
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            padding: 20px;
            text-align: center;
            margin: 0;
        }
        .nav-tabs {
            display: flex;
            justify-content: space-around;
            background-color: rgba(0, 0, 0, 0.05);
            padding: 10px 0;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }
        .tab-btn {
            background: none;
            border: none;
            font-size: 16px;
            font-weight: bold;
            color: var(--tg-theme-hint-color);
            cursor: pointer;
            padding: 5px 10px;
        }
        .tab-btn.active {
            color: var(--tg-theme-button-color);
            border-bottom: 2px solid var(--tg-theme-button-color);
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .order-btn {
            background: var(--tg-theme-button-color);
            color: var(--tg-theme-button-text-color);
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
        }
        select, input {
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ccc;
            margin-top: 5px;
            width: 80%;
            max-width: 300px;
        }
    </style>
</head>
<body>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="openTab('home')">Главная</button>
        <button class="tab-btn" onclick="openTab('catalog')">Каталог</button>
        <button class="tab-btn" onclick="openTab('orders')">Заказы</button>
    </div>

    <!-- ГЛАВНАЯ -->
    <div id="home" class="tab-content active">
        <h2>Магазин Aore Candles</h2>
        <p>Добро пожаловать!</p>
    </div>

    <!-- КАТАЛОГ -->
    <div id="catalog" class="tab-content">
        <h2>Каталог товаров</h2>
        <p>Выберите ароматную свечу:</p>
        <select id="candle">
            <option value="Кокос и Ваниль">🥥 Кокос и Ваниль</option>
            <option value="Лаванда">🪻 Лаванда</option>
            <option value="Табак и Бергамот">🪵 Табак и Бергамот</option>
        </select>

        <p>Ваше имя для связи:</p>
        <input type="text" id="userName" placeholder="Иван Иванов">

        <p>Телефон или юзернейм ТГ:</p>
        <input type="text" id="userContact" placeholder="+375...">
        <br>
        <button class="order-btn" id="orderBtn">Оформить заказ</button>
    </div>

    <!-- ЗАКАЗЫ -->
    <div id="orders" class="tab-content">
        <h2>Ваши заказы</h2>
        <p id="emptyOrders">У вас пока нет активных заказов.</p>
        <div id="ordersList" style="text-align: left; max-width: 300px; margin: 0 auto;"></div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.BackButton.show();

        let tabHistory = ['home'];

        function openTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            const btnIndex = tabId === 'home' ? 0 : tabId === 'catalog' ? 1 : 2;
            document.querySelectorAll('.tab-btn')[btnIndex].classList.add('active');
            if (tabHistory[tabHistory.length - 1] !== tabId) tabHistory.push(tabId);
        }

        tg.BackButton.onClick(function() {
            if (tabHistory.length > 1) {
                tabHistory.pop();
                openTab(tabHistory[tabHistory.length - 1]);
            } else {
                tg.close();
            }
        });

        // ЛОГИКА ОФОРМЛЕНИЯ ЗАКАЗА
        document.getElementById("orderBtn").addEventListener("click", () => {
            let item = document.getElementById("candle").value;
            let name = document.getElementById("userName").value.trim();
            let contact = document.getElementById("userContact").value.trim();

            if (!name || !contact) {
                alert("Пожалуйста, заполните имя и контакты!");
                return;
            }

            // Формируем структурированные данные (объект)
            let orderData = {
                product: item,
                customer_name: name,
                customer_contact: contact
            };

            // Сохраняем локально в браузере, чтобы заказ отобразился во вкладке "Заказы"
            let localOrders = JSON.parse(localStorage.getItem('my_orders') || '[]');
            localOrders.push(orderData);
            localStorage.setItem('my_orders', JSON.stringify(localOrders));

            // Отправляем данные боту (превращаем объект в строку)
            tg.sendData(JSON.stringify(orderData));
            tg.close();
        });

        // Функция для отображения сохраненных заказов во вкладке "Заказы"
        function loadLocalOrders() {
            let localOrders = JSON.parse(localStorage.getItem('my_orders') || '[]');
            let container = document.getElementById('ordersList');
            let emptyMsg = document.getElementById('emptyOrders');

            if(localOrders.length > 0) {
                emptyMsg.style.display = 'none';
                container.innerHTML = '';
                localOrders.forEach((order, index) => {
                    container.innerHTML += `<p><b>Заказ №${index + 1}:</b> ${order.product}<br><small>Статус: В обработке</small></p><hr>`;
                });
            }
        }
        loadLocalOrders(); // Запуск при старте
    </script>
</body>
</html>
